# Dependabot keeps our deps current and surfaces security advisories.
# Weekly cadence keeps the PR noise manageable; grouping consolidates
# related bumps into a single PR each Monday.
version: 2

updates:
  # npm dependencies (package.json)
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: America/Chicago
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: deps
      include: scope
    groups:
      # One PR per ecosystem-cluster per week. Cuts the noise floor from
      # 8–12 individual PRs to ~3.
      dev-tooling:
        applies-to: version-updates
        dependency-type: development
        patterns:
          - 'vitest'
          - '@vitest/*'
          - '@testing-library/*'
          - 'happy-dom'
          - 'eslint'
          - 'eslint-*'
          - '@eslint/*'
          - 'typescript-eslint'
          - 'typescript'
      build-tooling:
        applies-to: version-updates
        dependency-type: development
        patterns:
          - 'vite'
          - '@vitejs/*'
          - 'tailwindcss'
          - '@tailwindcss/*'
      react:
        applies-to: version-updates
        patterns:
          - 'react'
          - 'react-*'
          - '@types/react'
          - '@types/react-*'
      anthropic:
        applies-to: version-updates
        patterns:
          - '@anthropic-ai/*'

  # GitHub Actions used in .github/workflows/*.yml
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: America/Chicago
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: ci
      include: scope
